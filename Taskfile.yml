version: '3'

tasks:
  setup:
    desc: Activate committed git hooks
    cmds:
      - git config core.hooksPath .githooks
    silent: true

  build:
    desc: Build the doppel binary
    cmds:
      - go build -o doppel .

  build-stamped:
    desc: Build with a git-derived version, so a rebuild invalidates old baselines
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
    cmds:
      - go build -ldflags "-X github.com/LukasSelin/doppel/cmd.version={{.VERSION}}" -o doppel .

  dist:
    desc: Cross-compile the release archives into dist/ without publishing
    cmds:
      - goreleaser release --snapshot --clean

  release-check:
    desc: Validate .goreleaser.yaml against the installed goreleaser
    cmds:
      - goreleaser check

  test:
    desc: Run all tests
    cmds:
      - go test ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  fmt:
    desc: Format all Go files
    cmds:
      - gofmt -w .

  dashboard:
    desc: Build the HTML dashboard for this repo and open it
    vars:
      OUT: '{{.OUT | default "/tmp/doppel-dashboard.html"}}'
    cmds:
      - go run . analyze . -o {{.OUT}}
      - cmd: open {{.OUT}}
        platforms: [darwin]

  dashboard-dev:
    desc: Rebuild the dashboard reading assets off disk, so a JS/CSS edit needs no rebuild
    vars:
      OUT: '{{.OUT | default "/tmp/doppel-dashboard.html"}}'
    cmds:
      - DOPPEL_DASHBOARD_ASSETS=internal/dashboard/assets go run . analyze . -o {{.OUT}}

  snapshot:
    desc: Print a deterministic JSON snapshot of this repo's analysis
    cmds:
      - go run . analyze . --format json

  corpora:
    desc: Fetch the pinned public reference corpora (a few hundred MB, network)
    cmds:
      - DOPPEL_BENCH_FETCH=1 go test ./internal/bench/ -run TestFetchCorpora -v -timeout 30m

  bench:
    desc: Per-stage pipeline benchmarks over every fetched corpus
    cmds:
      - go test ./internal/bench/ -run '^$' -bench BenchmarkCorpus -timeout 60m

  golden:
    desc: Score the committed golden labels against the fetched corpora
    cmds:
      - go test ./internal/bench/ -run TestGoldenCorpora -v

  examples:
    desc: Regenerate examples/ from the fetched corpora
    cmds:
      - DOPPEL_BENCH_EXAMPLES=1 go test ./internal/bench/ -run TestGenerateExamples -v -timeout 30m

  examples-check:
    desc: Report whether examples/ is stale, without writing anything
    cmds:
      - DOPPEL_BENCH_EXAMPLES=1 DOPPEL_BENCH_EXAMPLES_CHECK=1 go test ./internal/bench/ -run TestGenerateExamples -v -timeout 30m

  baseline:
    desc: Score the golden labels and regenerate+checksum every fetched corpus's example report (in memory, self-contained) into examples/baseline.json; also refreshes examples/baseline-timings.json (machine-dependent, not part of the determinism guarantee)
    cmds:
      - DOPPEL_BENCH_BASELINE=1 go test ./internal/bench/ -run TestGenerateBaseline -v -timeout 30m

  memstats:
    desc: "Measure the exact per-stage heap accounting and its noise floor (CORPUS=<path>)"
    vars:
      CORPUS: '{{.CORPUS | default "."}}'
    cmds:
      - DOPPEL_BENCH_MEMSTATS={{.CORPUS}} go test ./cmd/ -run TestMemStatsNoiseFloor -v -timeout 30m

  ablate:
    desc: Zero each fingerprint blend component (WL/flow/depth/signature) in turn and score the labeled corpora — a measurement, not a gate
    cmds:
      - DOPPEL_BENCH_ABLATE=1 go test ./internal/bench/ -run TestAblateFingerprint -v -timeout 30m

  baselines:
    desc: "Rank the labels under doppel and simple baselines (random, token clones, code-shape, mass, overlap, names) — a measurement, see examples/baselines.md (MD=<results.md> EXPORT=<dir of ranked lists> CLONES=<dir from task clone-baseline>)"
    cmds:
      - DOPPEL_BENCH_BASELINES=1 DOPPEL_BENCH_BASELINES_MD={{.MD}} DOPPEL_BENCH_BASELINES_EXPORT={{.EXPORT}} DOPPEL_BENCH_BASELINES_CLONES={{.CLONES}} go test ./internal/bench/ -run 'TestBaselines$' -v -timeout 90m

  clone-baseline:
    desc: "Run dupl (installed into GOBIN, never the module) over the fetched ladder and write its clone groups for TestBaselines' method 8 (OUT=<dir>; then task baselines CLONES=<dir>)"
    cmds:
      # The detector runs outside the module, like the history labeller:
      # go.mod keeps Cobra as its only direct dependency.
      - ./scripts/clone-baseline.sh {{if .OUT}}-o {{.OUT}}{{end}}

  timeline:
    desc: "Analyse the last N git revisions of a repo and render one steppable timeline (REPO=. N=20 OUT=timeline.html)"
    vars:
      REPO: '{{.REPO | default "."}}'
      N: '{{.N | default "20"}}'
      OUT: '{{.OUT | default "/tmp/doppel-timeline.html"}}'
    cmds:
      # The git walk lives in the script, never in the tool: doppel reads no
      # git history by construction, and every claim it makes rests on that.
      - ./scripts/timeline.sh -r {{.REPO}} -n {{.N}} -o {{.OUT}}
      - cmd: open {{.OUT}}
        platforms: [darwin]

  history-labels:
    desc: "Derive golden labels for a ladder corpus from its git history and report agreement with the hand review (CORPUS=cobra OUT=<path>; default beside the history clone)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
    cmds:
      # Like timeline: the git walk lives outside the module, never in the tool.
      - ./scripts/history-labels.sh -c {{.CORPUS}} {{if .OUT}}-o {{.OUT}}{{end}}

  cost-study:
    desc: "Measure whether doppel's flagged pairs at T cost maintainers anything over T..pin, against matched controls (CORPUS=cobra OUT=<dir>; see examples/cost-study.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
    cmds:
      - ./scripts/cost-study.sh -c {{.CORPUS}} {{if .OUT}}-o {{.OUT}}{{end}}

  cost-study-summary:
    desc: "Turn cost-study JSON files into the summary tables (FILES='/abs/a.cost.json /abs/b.cost.json', absolute paths; OUT=<summary.md> SAMPLES=<samples.md>)"
    cmds:
      - go run -C scripts/historylabel . summarize {{if .OUT}}-out {{.OUT}}{{end}} {{if .SAMPLES}}-samples {{.SAMPLES}}{{end}} {{.FILES}}

  ranker-outcomes:
    desc: "Rank a corpus at the cost study's T under doppel and every baseline, and judge each pair on T..pin (CORPUS=cobra OUT=<dir>; see examples/ranker-outcomes.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
    cmds:
      - ./scripts/ranker-outcomes.sh -c {{.CORPUS}} {{if .OUT}}-o {{.OUT}}{{end}}

  ranker-outcomes-summary:
    desc: "Turn ranker-outcome JSON files into the comparison tables (FILES='/abs/a.outcomes.json ...', absolute paths; OUT=<summary.md>)"
    cmds:
      - go run -C scripts/historylabel . compare-summary -cost-dir {{.ROOT_DIR}}/examples/cost-study {{if .OUT}}-out {{.OUT}}{{end}} {{.FILES}}

  clone-outcomes:
    desc: "Rank a corpus at the cost study's T under doppel, dupl and all-pairs clone search, and judge each pair on T..pin (CORPUS=cobra OUT=<dir>; see examples/clone-outcomes.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
    cmds:
      - ./scripts/ranker-outcomes.sh -s clones -c {{.CORPUS}} {{if .OUT}}-o {{.OUT}}{{end}}

  clone-outcomes-summary:
    desc: "Turn clone-outcome JSON files into the comparison tables (FILES='/abs/a.clone-outcomes.json ...', absolute paths; OUT=<summary.md>)"
    cmds:
      - go run -C scripts/historylabel . compare-summary -reference {{.ROOT_DIR}}/examples/ranker-outcomes -overlap {{if .OUT}}-out {{.OUT}}{{end}} {{.FILES}}

  fusion-outcomes:
    desc: "Rank a corpus at the cost study's T under doppel, dupl, token clones and their RRF fusion, and judge each pair on T..pin (CORPUS=cobra OUT=<dir>; see examples/fusion-outcomes.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
    cmds:
      - ./scripts/ranker-outcomes.sh -s fusion -c {{.CORPUS}} {{if .OUT}}-o {{.OUT}}{{end}}

  fusion-outcomes-summary:
    desc: "Turn fusion-outcome JSON files into the comparison tables (FILES='/abs/a.fusion-outcomes.json ...', absolute paths; OUT=<summary.md>)"
    cmds:
      - go run -C scripts/historylabel . compare-summary -inputs {{.ROOT_DIR}}/examples/clone-outcomes -fusion -overlap {{if .OUT}}-out {{.OUT}}{{end}} {{.FILES}}

  outcome-reanalysis:
    desc: "Re-run both outcome studies' summaries under the paired and paired-clustered bootstraps, from the committed outcome files (see examples/outcome-reanalysis.md)"
    vars:
      R: '{{.ROOT_DIR}}/examples/ranker-outcomes'
      C: '{{.ROOT_DIR}}/examples/clone-outcomes'
      O: '{{.ROOT_DIR}}/examples/outcome-reanalysis'
      CORPORA: cobra gin prometheus hugo moby
    cmds:
      - for: [paired, paired-clustered]
        cmd: go run -C scripts/historylabel . compare-summary -bootstrap {{.ITEM}} -cost-dir {{.ROOT_DIR}}/examples/cost-study -out {{.O}}/ranker-outcomes.{{.ITEM}}.md {{range splitList " " .CORPORA}}{{$.R}}/{{.}}.outcomes.json {{end}}
      - for: [paired, paired-clustered]
        cmd: go run -C scripts/historylabel . compare-summary -bootstrap {{.ITEM}} -reference {{.R}} -overlap -out {{.O}}/clone-outcomes.{{.ITEM}}.md {{range splitList " " .CORPORA}}{{$.C}}/{{.}}.clone-outcomes.json {{end}}

  rolling-origin:
    desc: "Rank a corpus at earlier origins T_k under both outcome studies' methods, and judge each on its own window T_k..T_k-1 (CORPUS=cobra ORIGINS='2 3' OUT=<dir>; see examples/rolling-origin.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
      ORIGINS: '{{.ORIGINS | default "2 3"}}'
    cmds:
      - ./scripts/rolling-origin.sh -c {{.CORPUS}} -k "{{.ORIGINS}}" {{if .OUT}}-o {{.OUT}}{{end}}

  rolling-origin-summary:
    desc: "Pool the committed outcome files over every origin into examples/rolling-origin/summary.md"
    cmds:
      - go run -C scripts/historylabel . rolling-summary -origins {{.ROOT_DIR}}/examples/rolling-origin -out {{.ROOT_DIR}}/examples/rolling-origin/summary.md {{.ROOT_DIR}}/examples/ranker-outcomes/*.outcomes.json {{.ROOT_DIR}}/examples/clone-outcomes/*.clone-outcomes.json {{.ROOT_DIR}}/examples/rolling-origin/*.json

  size-aware-rank:
    desc: "Rank a corpus under the clone-outcome methods and the size-aware variants, at the cost study's T (development) and at earlier origins (test), judged under -sweep-scope commit (CORPUS=cobra ORIGINS='2 3' OUT=<dir>; see examples/size-aware-rank.md)"
    vars:
      CORPUS: '{{.CORPUS | default "cobra"}}'
      ORIGINS: '{{.ORIGINS | default "2 3"}}'
      OUT: '{{.OUT | default (print .ROOT_DIR "/examples/size-aware-rank")}}'
    cmds:
      - ./scripts/ranker-outcomes.sh -s size -c {{.CORPUS}} -o {{.OUT}}
      - ./scripts/rolling-origin.sh -s size -c {{.CORPUS}} -k "{{.ORIGINS}}" -o {{.OUT}}

  size-aware-rank-summary:
    desc: "Score the size-aware variants on the development windows and on the test windows (examples/size-aware-rank/{dev,test}.md)"
    vars:
      D: '{{.ROOT_DIR}}/examples/size-aware-rank'
    cmds:
      - go run -C scripts/historylabel . size-summary -out {{.D}}/dev.md {{range splitList " " "cobra gin prometheus hugo moby"}}{{$.D}}/{{.}}.size-outcomes.json {{end}}
      - go run -C scripts/historylabel . size-summary -origins {{.ROOT_DIR}}/examples/rolling-origin -out {{.D}}/test.md {{.D}}/cobra.o2.size-outcomes.json {{.D}}/cobra.o3.size-outcomes.json {{.D}}/gin.o3.size-outcomes.json {{.D}}/prometheus.o2.size-outcomes.json {{.D}}/prometheus.o3.size-outcomes.json {{.D}}/hugo.o2.size-outcomes.json {{.D}}/hugo.o3.size-outcomes.json {{.D}}/moby.o2.size-outcomes.json {{.D}}/moby.o3.size-outcomes.json

  size-aware-rank-golden:
    desc: "Score the production key, the development candidates and the locked size-aware variants against the cobra hand labels"
    cmds:
      - go test ./internal/bench/ -run '^TestSizeVariantsGolden$' -count=1 -v

  size-aware-check-labels:
    desc: "Check 1 of examples/size-aware-check.md: score production and the size variants against every labelled corpus (LABELS=<private labels dir> EXTRA='<root>;<root>'); the log names private pairs, keep it out of the repo"
    cmds:
      - DOPPEL_BENCH_SIZECHECK=1 DOPPEL_BENCH_LENSES_LABELS="{{.LABELS}}" DOPPEL_BENCH_LENSES_EXTRA="{{.EXTRA}}" go test ./internal/bench/ -run '^TestSizeCheckLabels$' -count=1 -v -timeout 60m

  size-aware-check-outcomes:
    desc: "Check 2 of examples/size-aware-check.md: chi and conc at the rolling origins under the size-aware method set, then the summary"
    vars:
      D: '{{.ROOT_DIR}}/examples/size-aware-check'
    cmds:
      - ./scripts/rolling-origin.sh -s size -c chi -k "1 2 3" -o {{.D}}
      - ./scripts/rolling-origin.sh -s size -c conc -k "1 2 3" -o {{.D}}
      - go run -C scripts/historylabel . size-summary -origins {{.D}} -out {{.D}}/chi.md {{.D}}/chi.o2.size-outcomes.json

  size-aware-check-top20:
    desc: "Check 3 of examples/size-aware-check.md: the report's top 20 under production and K-size on chi, conc, cobra and gin; blind.tsv and directions.tsv go to OUT"
    vars:
      OUT: '{{.OUT | default (print .ROOT_DIR "/examples/size-aware-check")}}'
    cmds:
      - DOPPEL_BENCH_SIZECHECK_TOP20=chi,conc,cobra,gin DOPPEL_BENCH_SIZECHECK_OUT="{{.OUT}}" go test ./internal/bench/ -run '^TestSizeCheckTop20$' -count=1 -v

  pages:
    desc: Build the published site into _site/, exactly as the Pages workflow does
    vars:
      OUT: '{{.OUT | default "_site"}}'
    cmds:
      # The provenance placeholders stay unsubstituted locally: the workflow
      # fills them from the pushed commit, and inventing a value here would
      # make a local build claim an identity it does not have.
      - mkdir -p {{.OUT}}
      - go run . analyze . -o {{.OUT}}/report.html
      - DOPPEL_BENCH_PAGES={{.OUT}} go test ./internal/bench/ -run TestGeneratePagesSite -v -timeout 30m
      - cp internal/dashboard/assets/vendor/broadsheet.css {{.OUT}}/
      - cp .github/pages/index.html {{.OUT}}/index.html
