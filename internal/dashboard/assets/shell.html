<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>doppel — {{ .Target }}</title>
  <style>{{ .CSS }}</style>
</head>

<body>
  <div class="page">

    <header class="masthead">
      <div class="rule-heavy"></div>
      <div class="masthead-row">
        <div class="masthead-id">
          <div class="kicker">doppel · erosion report</div>
          <h1 class="masthead-title">{{ .Target }}</h1>
          <div class="masthead-sub mono" id="operating-point"></div>
        </div>
        <div class="masthead-tools">
          <nav class="tabs" id="tabs" aria-label="Report screens">
            <a class="tab" href="#triage" data-screen="triage">Triage</a>
            <a class="tab" href="#atlas" data-screen="atlas">Atlas</a>
            <a class="tab" href="#briefing" data-screen="briefing">Briefing</a>
          </nav>
          <div class="jump">
            <label class="visually-hidden" for="jump">Find a function</label>
            <input type="search" id="jump" placeholder="Find a function…" autocomplete="off" list="jump-list">
            <datalist id="jump-list"></datalist>
          </div>
        </div>
      </div>
      <div class="rule-fine"></div>
    </header>

    <main class="screens">
      <section class="screen" id="screen-triage" data-screen="triage" hidden></section>
      <section class="screen" id="screen-atlas" data-screen="atlas" hidden></section>
      <section class="screen" id="screen-briefing" data-screen="briefing" hidden></section>
      <section class="screen" id="screen-case" data-screen="case" hidden></section>
    </main>

    <footer class="colophon" id="colophon"></footer>
  </div>

  <script type="application/json" id="doppel-data">{{ .Data }}</script>
  <script>{{ .Script }}</script>
</body>

</html>
