name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Superseded PR runs are pure latency: three pushes in a row otherwise leave two
# stale 3-OS matrices occupying runners ahead of the one whose result you want.
# The wiki job deliberately does the opposite — see wiki.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Release archives ship linux, darwin and windows binaries, so the test
    # suite has to have run on all three before a tag is cut.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The pre-commit hook checks this too, but only after `task setup`, which
      # nothing enforces — so formatting drift reaches master without it.
      # One leg is enough: gofmt's output does not vary by platform.
      - name: Gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'task fmt'." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      # The JSON snapshot is what the hooks diff, so a schema panic or a
      # nondeterministic field has to fail here rather than in a session.
      # Determinism is platform-independent, and /tmp, printf and diff are
      # Git Bash assumptions, so this and the hook check stay on Linux.
      - name: Snapshot is deterministic
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . analyze . --format json > /tmp/a.json
          go run . analyze . --format json > /tmp/b.json
          diff /tmp/a.json /tmp/b.json

      # The dashboard inlines a JSON payload of the same run, so it is subject
      # to the same rule: an unchanged tree must produce an identical page.
      - name: Dashboard is deterministic
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . analyze . -o /tmp/a.html
          go run . analyze . -o /tmp/b.html
          diff /tmp/a.html /tmp/b.html

      - name: Hook entry points respond
        if: matrix.os == 'ubuntu-latest'
        run: |
          printf '{"session_id":"ci","cwd":"%s","source":"startup"}' "$PWD" > /tmp/hook.json
          go run . hook session-start < /tmp/hook.json > /tmp/ss.json
          grep -q additionalContext /tmp/ss.json
          go run . hook stop < /tmp/hook.json > /tmp/stop.json
          test ! -s /tmp/stop.json

      # The published page at lukasselin.github.io/doppel always shows master's
      # tip, so there is no way to fetch the report as of one merge. This
      # attaches that copy. Push to master only — the workflow's push trigger is
      # already scoped to that branch, so this pair of conditions is exactly
      # "a merge landed"; PR runs are unchanged.
      #
      # Rendered under RUNNER_TEMP rather than into the tree, for the reason
      # pages.yml documents for _site/: an output file inside the working tree
      # is a file the very run writing it would walk. Deliberately a third
      # render rather than reusing the determinism check's /tmp/a.html — that
      # file is an assertion's scratch space, and an artifact quietly depending
      # on it would break the moment someone reworks the check.
      - name: Render the self-report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/doppel-report"
          go run . analyze . -o "$RUNNER_TEMP/doppel-report/report.html"

      - name: Upload the self-report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: doppel-report-${{ github.sha }}
          path: ${{ runner.temp }}/doppel-report/report.html
          retention-days: 30
          # An empty artifact is worse than a failed job: it looks like the
          # report was captured.
          if-no-files-found: error
