name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Superseded PR runs are pure latency: three pushes in a row otherwise leave two
# stale 3-OS matrices occupying runners ahead of the one whose result you want.
# The wiki job deliberately does the opposite — see wiki.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Release archives ship linux, darwin and windows binaries, so the test
    # suite has to have run on all three before a tag is cut.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The pre-commit hook checks this too, but only after `task setup`, which
      # nothing enforces — so formatting drift reaches master without it.
      # One leg is enough: gofmt's output does not vary by platform.
      - name: Gofmt
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files — run 'task fmt'." >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # arm64 fuses x*y + z into one FMA where amd64 does not, so an unrounded
      # product in a score is a last-bit difference between a Mac and Linux.
      # The cross-platform job sees that only where this tree's numbers happen
      # to hit it; this reads the arm64 build itself and names every fused site
      # with its source line. A cross-compile, so one leg is enough.
      - name: No fused multiply-add in doppel code
        if: matrix.os == 'ubuntu-latest'
        run: bash scripts/fma-check.sh

      - name: Test
        run: go test ./...

      # What the cross-platform job compares: the snapshot and the dashboard of
      # this tree, from every leg, byte for byte. -buildvcs=false makes the recorded build
      # identity (devel) everywhere, so no leg can differ by a VCS stamp it
      # alone reads as dirty. _xplat/ is skipped by the walk like any
      # underscore-prefixed directory, so the second run cannot read the first
      # one's output.
      - name: Write cross-platform outputs
        shell: bash
        run: |
          mkdir -p _xplat
          go run -buildvcs=false . analyze . --format json > _xplat/snapshot.json
          go run -buildvcs=false . analyze . -o _xplat/report.html > /dev/null

      - name: Upload cross-platform outputs
        uses: actions/upload-artifact@v5
        with:
          name: xplat-${{ matrix.os }}
          path: _xplat/
          retention-days: 7
          if-no-files-found: error

      # The JSON snapshot is what the hooks diff, so a schema panic or a
      # nondeterministic field has to fail here rather than in a session.
      # Run-to-run determinism is one question on every OS, so one leg answers
      # it; whether the OSes agree with each other is the cross-platform job's
      # question, which two runs on one OS cannot see.
      - name: Snapshot is deterministic
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . analyze . --format json > /tmp/a.json
          go run . analyze . --format json > /tmp/b.json
          diff /tmp/a.json /tmp/b.json

      # The dashboard inlines a JSON payload of the same run, so it is subject
      # to the same rule: an unchanged tree must produce an identical page.
      - name: Dashboard is deterministic
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . analyze . -o /tmp/a.html
          go run . analyze . -o /tmp/b.html
          diff /tmp/a.html /tmp/b.html

      # A timeline is a second inlined payload over a series of runs, so it is
      # subject to the same rule. Two snapshots of one tree at a pinned
      # operating point is the smallest series there is, and it exercises the
      # refusal path too: an unpinned pair would be rejected rather than drawn.
      - name: Timeline is deterministic
        if: matrix.os == 'ubuntu-latest'
        run: |
          go run . analyze . --format json --threshold 0.38 --struct-min 0.0 --top 0 --max-per-func 0 > /tmp/t0.json
          cp /tmp/t0.json /tmp/t1.json
          go run . timeline /tmp/t0.json /tmp/t1.json -o /tmp/ta.html > /dev/null
          go run . timeline /tmp/t0.json /tmp/t1.json -o /tmp/tb.html > /dev/null
          diff /tmp/ta.html /tmp/tb.html

      - name: Hook entry points respond
        if: matrix.os == 'ubuntu-latest'
        run: |
          printf '{"session_id":"ci","cwd":"%s","source":"startup"}' "$PWD" > /tmp/hook.json
          go run . hook session-start < /tmp/hook.json > /tmp/ss.json
          grep -q additionalContext /tmp/ss.json
          go run . hook stop < /tmp/hook.json > /tmp/stop.json
          test ! -s /tmp/stop.json

      # The published page at lukasselin.github.io/doppel always shows master's
      # tip, so there is no way to fetch the report as of one merge. This
      # attaches that copy. Push to master only — the workflow's push trigger is
      # already scoped to that branch, so this pair of conditions is exactly
      # "a merge landed"; PR runs are unchanged.
      #
      # Rendered under RUNNER_TEMP rather than into the tree, for the reason
      # pages.yml documents for _site/: an output file inside the working tree
      # is a file the very run writing it would walk. Deliberately a third
      # render rather than reusing the determinism check's /tmp/a.html — that
      # file is an assertion's scratch space, and an artifact quietly depending
      # on it would break the moment someone reworks the check.
      - name: Render the self-report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        run: |
          mkdir -p "$RUNNER_TEMP/doppel-report"
          go run . analyze . -o "$RUNNER_TEMP/doppel-report/report.html"

      - name: Upload the self-report
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'push'
        uses: actions/upload-artifact@v5
        with:
          name: doppel-report-${{ github.sha }}
          path: ${{ runner.temp }}/doppel-report/report.html
          retention-days: 30
          # An empty artifact is worse than a failed job: it looks like the
          # report was captured.
          if-no-files-found: error

  # The build job's determinism steps run one OS twice, and that cannot see
  # output that is stable on each platform and different between them, which
  # is the shape a cross-platform bug here takes. Calibration hashed the walk's
  # own paths, backslash-separated on Windows, so one commit calibrated to
  # different floors there than on Linux, and every report downstream of the
  # floors differed, identically on every run. This compares what each leg
  # wrote for the same commit.
  #
  # Byte for byte, all three legs, both files. The macos leg is arm64, so this
  # is also the architecture check: it read the snapshot's score, overlap and
  # containment a bit apart from amd64's until the arm64 build stopped fusing
  # multiply-adds and stopped using the standard library's Log and Exp, which
  # differ between the two (see internal/detmath).
  cross-platform:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: xplat-*
          path: xplat

      - name: Every platform wrote the same report
        run: |
          cd xplat
          status=0
          for os in windows-latest macos-latest; do
            for f in snapshot.json report.html; do
              if ! cmp -s "xplat-ubuntu-latest/$f" "xplat-$os/$f"; then
                echo "::error::$f differs between ubuntu-latest and $os"
                status=1
              fi
            done
          done
          # The operating point is the first thing to read: a moved floor
          # changes every pair after it.
          if [ "$status" != 0 ]; then
            for os in ubuntu-latest windows-latest macos-latest; do
              echo "$os params: $(jq -c .params "xplat-$os/snapshot.json")"
            done
          fi
          exit $status
